# =============================================================================
# SEC-009.3 Phase 3 — Backend API Authorization Validation (TEMPORARY)
# =============================================================================
# Purpose: Validate Phase 3 API tenant isolation against real Supabase Local
#          + real PostgreSQL + real Supabase Auth + real Express backend.
#
# This workflow is TEMPORARY. It will be deleted after Phase 3 audit completes.
# It is NOT a Required Status Check. It does NOT modify ci.yml.
#
# Trigger: workflow_dispatch (manual only)
# =============================================================================

name: sec-009.3-phase3-validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "2.115.0"
  TEST_MODE: ci

jobs:
  phase3-validation:
    name: phase3-api-validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Docker verification
      # -----------------------------------------------------------------------
      - name: Docker version
        run: docker --version

      - name: Docker info
        run: docker info --format '{{.ServerVersion}}'

      # -----------------------------------------------------------------------
      # 2. Supabase CLI install (pinned version)
      # -----------------------------------------------------------------------
      - name: Install Supabase CLI v${{ env.SUPABASE_CLI_VERSION }}
        run: |
          cd /tmp
          curl -fsSL \
            "https://github.com/supabase/cli/releases/download/v${{ env.SUPABASE_CLI_VERSION }}/supabase_linux_amd64.tar.gz" \
            | tar -xz
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      # -----------------------------------------------------------------------
      # 3. Supabase init (creates config.toml if absent)
      # -----------------------------------------------------------------------
      - name: Supabase init
        run: supabase init

      # -----------------------------------------------------------------------
      # 4. Docker diagnostics + Supabase start (with retry)
      # -----------------------------------------------------------------------
      - name: Docker diagnostics
        run: |
          echo "=== docker version ==="
          docker version
          echo ""
          echo "=== docker info ==="
          docker info
          echo ""
          echo "=== docker network ls ==="
          docker network ls
          echo ""
          echo "=== docker ps -a ==="
          docker ps -a
          echo ""
          echo "=== df -h ==="
          df -h

      - name: Supabase start (with retry)
        id: supa-start
        run: |
          set -o pipefail
          echo "START_TIME=$(date +%s)" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            if supabase start --debug 2>&1 | tee /tmp/supa-start-output.txt; then
              echo "supabase start succeeded on attempt $attempt"
              break
            fi
            echo "supabase start failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              echo "--- Docker state after failure ---"
              docker ps -a
              docker network ls
              echo "Waiting 20s before retry..."
              sleep 20
            else
              echo "All 3 attempts failed"
              exit 1
            fi
          done
          echo "END_TIME=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Report Supabase startup
        run: |
          START=${{ steps.supa-start.outputs.START_TIME }}
          END=${{ steps.supa-start.outputs.END_TIME }}
          echo "Supabase start duration: $(( END - START ))s"
          echo ""
          echo "=== supabase start output (last 80 lines) ==="
          tail -80 /tmp/supa-start-output.txt

      # -----------------------------------------------------------------------
      # 5. Extract Supabase Local environment variables
      # -----------------------------------------------------------------------
      - name: Extract Supabase env vars
        run: |
          set -euo pipefail

          echo "=== Supabase status env names ==="

          OUTPUT=$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)

          echo "$OUTPUT" | sed -E 's/=.*$/=<redacted>/'

          KEY=$(printf '%s\n' "$OUTPUT" |
            sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' |
            tr -d '"')

          URL=$(printf '%s\n' "$OUTPUT" |
            sed -n 's/^SUPABASE_URL=//p' |
            tr -d '"')

          echo "KEY_PRESENT=$([ -n "$KEY" ] && echo yes || echo no)"
          echo "URL=$URL"

          if [ -z "$KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY missing after override-name"
            exit 1
          fi

          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL missing after override-name"
            exit 1
          fi

          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$URL" >> "$GITHUB_ENV"

          echo "✅ SUPABASE_SERVICE_ROLE_KEY=<present>"
          echo "✅ SUPABASE_URL=$URL"

      # -----------------------------------------------------------------------
      # 5. Database reset (applies all 72 migrations + seed.sql)
      # -----------------------------------------------------------------------
      - name: Supabase db reset
        id: supa-reset
        run: |
          echo "RESET_START=$(date +%s)" >> "$GITHUB_OUTPUT"
          supabase db reset 2>&1
          echo "RESET_END=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Report migration reset
        run: |
          START=${{ steps.supa-reset.outputs.RESET_START }}
          END=${{ steps.supa-reset.outputs.RESET_END }}
          echo "DB reset duration: $(( END - START ))s"

      # -----------------------------------------------------------------------
      # 6. Schema verification
      # -----------------------------------------------------------------------
      - name: Verify schema
        run: |
          supabase db query --local <<'SQL'
          SELECT
            (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public') AS table_count,
            (SELECT count(*) FROM information_schema.routines WHERE routine_schema = 'private') AS private_routine_count;
          SQL

      # -----------------------------------------------------------------------
      # 7. Install dependencies
      # -----------------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      # -----------------------------------------------------------------------
      # 8. Phase 1 regression (DB/RLS — 29 tests)
      # -----------------------------------------------------------------------
      - name: "Phase 1 regression: DB/RLS tenant isolation"
        run: npm run test:tenant:db

      # -----------------------------------------------------------------------
      # 9. Phase 2 regression (RPC — 48 tests)
      # -----------------------------------------------------------------------
      - name: "Phase 2 regression: RPC authorization"
        run: npm run test:tenant:rpc

      # -----------------------------------------------------------------------
      # 10. Phase 3: API authorization (37 tests)
      # -----------------------------------------------------------------------
      - name: "Phase 3: API authorization (real JWT + real backend)"
        run: npm run test:tenant:api:ci

      # -----------------------------------------------------------------------
      # 11. Global regression
      # -----------------------------------------------------------------------
      - name: Root / frontend tests
        run: npm test

      - name: Security regression suite
        run: npm run test:security

      - name: Backend tests
        run: npm test --prefix backend

      # -----------------------------------------------------------------------
      # 12. Typecheck
      # -----------------------------------------------------------------------
      - name: Typecheck root
        run: npx tsc --noEmit

      - name: Typecheck backend
        run: npx tsc --noEmit -p backend

      # -----------------------------------------------------------------------
      # 13. Build
      # -----------------------------------------------------------------------
      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build --prefix backend

      # -----------------------------------------------------------------------
      # 14. Working tree check
      # -----------------------------------------------------------------------
      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty — unexpected file changes detected"
            git status --short
            exit 1
          fi
          echo "Working tree is clean"

      # -----------------------------------------------------------------------
      # 15. Cleanup (always runs)
      # -----------------------------------------------------------------------
      - name: Stop Supabase
        if: always()
        run: supabase stop
